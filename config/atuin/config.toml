# Atuin · histórico local, sem sincronização e sem import automático.
auto_sync = false
update_check = false
enter_accept = false

# Já é o padrão do Atuin; explícito para documentar a intenção.
# Cobre padrões conhecidos de chaves (ex.: AWS, tokens) — não é garantia.
secrets_filter = true

search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 18
show_preview = true
show_help = true
workspaces = true

# Filtros adicionais (regex Rust). Defesa em profundidade, não garantia absoluta.
history_filter = [
  "(?i)^(export|setenv)\\b.*(password|passwd|token|secret|api[_-]?key|private[_-]?key)=",
  "(?i)^(printenv|env)([[:space:]]|$)",
  "(?i)(--password|--token|--api-key|--secret)(=|[[:space:]])",
  "(?i)\\b(cat|less|more|bat|head|tail|sed|awk|grep)[[:space:]].*\\.env([[:space:]]|$)",
  "(?i)(gh auth token|gcloud auth print-access-token|aws configure get|kubectl get secret|vault kv get|op read|pass show)",
  "(?i)^lerd[[:space:]]+(share:token|stripe:login)([[:space:]]|$)",
  # mysql/mysqldump com senha colada no -p (ex.: -pSenha123). "-p " sozinho não casa.
  "(?i)\\bmysql(dump)?\\b.*[[:space:]]-p[^[:space:]]"
]

cwd_filter = [
  "^/home/[^/]+/\\.ssh(/|$)",
  "^/home/[^/]+/\\.gnupg(/|$)"
]
